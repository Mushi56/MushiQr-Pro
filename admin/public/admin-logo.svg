<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14182B"/>
      <stop offset="100%" stop-color="#090B14"/>
    </linearGradient>

    <!-- Admin Purple-Pink Accent Gradient -->
    <linearGradient id="ribbon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D9D"/>
      <stop offset="50%" stop-color="#7B61FF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    
    <!-- Admin Gold Badge Gradient -->
    <linearGradient id="admin-gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <!-- Glow effect -->
    <filter id="ribbon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="badge-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Squircle Base for App Icon -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg-grad)" stroke="rgba(245, 158, 11, 0.4)" stroke-width="6"/>

  <!-- QR Code Pattern Modules (Subtle White) -->
  <g fill="#FFFFFF" opacity="0.8">
    <!-- Top-Left Finder -->
    <rect x="64" y="64" width="100" height="100" rx="16"/>
    <rect x="78" y="78" width="72" height="72" rx="10" fill="none" stroke="#FFFFFF" stroke-width="10"/>
    <rect x="96" y="96" width="36" height="36" rx="6"/>

    <!-- Top-Right Finder -->
    <rect x="348" y="64" width="100" height="100" rx="16"/>
    <rect x="362" y="78" width="72" height="72" rx="10" fill="none" stroke="#FFFFFF" stroke-width="10"/>
    <rect x="380" y="96" width="36" height="36" rx="6"/>

    <!-- Bottom-Left Finder -->
    <rect x="64" y="348" width="100" height="100" rx="16"/>
    <rect x="78" y="362" width="72" height="72" rx="10" fill="none" stroke="#FFFFFF" stroke-width="10"/>
    <rect x="96" y="380" width="36" height="36" rx="6"/>

    <!-- Data Modules (Scatter) -->
    <rect x="188" y="64" width="22" height="22" rx="5"/>
    <rect x="226" y="64" width="22" height="22" rx="5"/>
    <rect x="264" y="64" width="22" height="22" rx="5"/>
    <rect x="302" y="64" width="22" height="22" rx="5"/>
    
    <rect x="188" y="102" width="22" height="22" rx="5"/>
    <rect x="264" y="102" width="22" height="22" rx="5"/>
    <rect x="302" y="102" width="22" height="22" rx="5"/>

    <rect x="64" y="188" width="22" height="22" rx="5"/>
    <rect x="64" y="226" width="22" height="22" rx="5"/>
    <rect x="64" y="264" width="22" height="22" rx="5"/>

    <rect x="426" y="188" width="22" height="22" rx="5"/>
    <rect x="426" y="226" width="22" height="22" rx="5"/>
    <rect x="426" y="264" width="22" height="22" rx="5"/>
  </g>

  <!-- Flowing Ribbon "M" with Glow -->
  <path d="M 40,260 
           C 120,260 140,110 200,110 
           C 260,110 270,330 320,170 
           C 370,10 420,260 472,260" 
        stroke="url(#ribbon-grad)" 
        stroke-width="44" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none" 
        filter="url(#ribbon-glow)"/>

  <!-- Secondary Ribbon Highlight -->
  <path d="M 40,260 
           C 120,260 140,110 200,110 
           C 260,110 270,330 320,170 
           C 370,10 420,260 472,260" 
        stroke="rgba(255,255,255,0.3)" 
        stroke-width="10" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none"
        transform="translate(0, -4)"/>

  <!-- Big White Stylized "M" Core -->
  <text x="140" y="385" font-family="'Outfit', 'Inter', Arial, sans-serif" font-weight="900" font-size="260" fill="#FFFFFF" opacity="0.95" style="filter: drop-shadow(0px 8px 16px rgba(0,0,0,0.6))">M</text>

  <!-- Distinct Golden ADMIN Badge (Bottom Right) -->
  <g filter="url(#badge-shadow)">
    <!-- Badge Background -->
    <rect x="230" y="380" width="240" height="88" rx="24" fill="url(#admin-gold-grad)" stroke="#FFFFFF" stroke-width="4"/>
    <rect x="234" y="384" width="232" height="80" rx="20" fill="none" stroke="rgba(0,0,0,0.2)" stroke-width="3"/>
    
    <!-- Shield Icon on Badge -->
    <g transform="translate(252, 400) scale(1.8)" fill="#0F1221">
      <path d="M12 2L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-3z"/>
    </g>

    <!-- ADMIN Text -->
    <text x="375" y="440" text-anchor="middle" font-family="'Outfit', Arial, sans-serif" font-weight="900" font-size="38" fill="#0F1221" letter-spacing="4">ADMIN</text>
  </g>
</svg>
