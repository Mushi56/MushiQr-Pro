<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" fill="none">
  <!-- Background blob -->
  <ellipse cx="200" cy="145" rx="158" ry="130" fill="#FFF0F2" opacity="0.9"/>

  <!-- Decorative scatter elements -->
  <!-- Blue X top-left -->
  <g transform="translate(60, 42)" stroke="#6EC6FF" stroke-width="2.5" stroke-linecap="round">
    <line x1="0" y1="0" x2="10" y2="10"/>
    <line x1="10" y1="0" x2="0" y2="10"/>
  </g>
  <!-- Pink burst top-right -->
  <g transform="translate(300, 38)" stroke="#FF5A76" stroke-width="2.5" stroke-linecap="round">
    <line x1="8" y1="0" x2="8" y2="7"/>
    <line x1="8" y1="14" x2="8" y2="21"/>
    <line x1="0" y1="7" x2="6" y2="10.5"/>
    <line x1="10" y1="10.5" x2="16" y2="7"/>
  </g>
  <!-- Pink hollow circle left -->
  <circle cx="72" cy="155" r="5" stroke="#FF9EC0" stroke-width="2" fill="none"/>
  <!-- Blue dot left -->
  <circle cx="55" cy="108" r="3.5" fill="#A8D8FF" opacity="0.8"/>
  <!-- Blue star right -->
  <g transform="translate(330, 100)">
    <path d="M6 0 L7.2 4.5 L12 4.5 L8.2 7.2 L9.6 12 L6 9 L2.4 12 L3.8 7.2 L0 4.5 L4.8 4.5 Z" fill="#7CC8FF" opacity="0.7"/>
  </g>
  <!-- Pink diamond right -->
  <g transform="translate(340, 145)">
    <path d="M5 0 L10 5 L5 10 L0 5 Z" fill="#FFB3C6" opacity="0.8"/>
  </g>
  <!-- Dashed arc left -->
  <path d="M48 185 Q30 155 55 130" stroke="#CCDDEE" stroke-width="1.5" fill="none" stroke-dasharray="4 4" stroke-linecap="round"/>

  <!-- QR Code Card (main) -->
  <g transform="translate(120, 30)">
    <!-- Card shadow -->
    <rect x="8" y="8" width="178" height="178" rx="22" fill="rgba(0,0,0,0.06)"/>
    <!-- Card white body -->
    <rect width="178" height="178" rx="22" fill="#FFFFFF" stroke="#EDEDED" stroke-width="1.5"/>

    <!-- QR corner brackets (scan frame effect) -->
    <!-- Top-left bracket -->
    <g stroke="#C8C8D0" stroke-width="3" stroke-linecap="round" fill="none">
      <polyline points="20,46 20,24 42,24"/>
      <!-- Top-right bracket -->
      <polyline points="136,24 158,24 158,46"/>
      <!-- Bottom-left bracket -->
      <polyline points="20,132 20,154 42,154"/>
      <!-- Bottom-right bracket -->
      <polyline points="136,154 158,154 158,132"/>
    </g>

    <!-- QR modules (simplified stylised QR art) -->
    <!-- Top-left position square -->
    <rect x="30" y="34" width="36" height="36" rx="5" fill="#D8D8E0" opacity="0.6"/>
    <rect x="37" y="41" width="22" height="22" rx="3" fill="#FFFFFF" opacity="0.9"/>
    <rect x="43" y="47" width="10" height="10" rx="2" fill="#D0D0D8" opacity="0.7"/>

    <!-- Top-right position square -->
    <rect x="112" y="34" width="36" height="36" rx="5" fill="#D8D8E0" opacity="0.6"/>
    <rect x="119" y="41" width="22" height="22" rx="3" fill="#FFFFFF" opacity="0.9"/>
    <rect x="125" y="47" width="10" height="10" rx="2" fill="#D0D0D8" opacity="0.7"/>

    <!-- Bottom-left position square -->
    <rect x="30" y="108" width="36" height="36" rx="5" fill="#D8D8E0" opacity="0.6"/>
    <rect x="37" y="115" width="22" height="22" rx="3" fill="#FFFFFF" opacity="0.9"/>
    <rect x="43" y="121" width="10" height="10" rx="2" fill="#D0D0D8" opacity="0.7"/>

    <!-- QR data modules (middle abstract patterns) -->
    <rect x="78" y="34" width="8" height="8" rx="2" fill="#D8D8E0" opacity="0.5"/>
    <rect x="90" y="34" width="8" height="8" rx="2" fill="#D8D8E0" opacity="0.4"/>
    <rect x="78" y="46" width="8" height="8" rx="2" fill="#D8D8E0" opacity="0.4"/>
    <rect x="90" y="56" width="8" height="8" rx="2" fill="#D8D8E0" opacity="0.5"/>

    <rect x="78" y="78" width="8" height="8" rx="2" fill="#D8D8E0" opacity="0.4"/>
    <rect x="90" y="78" width="8" height="8" rx="2" fill="#D8D8E0" opacity="0.3"/>
    <rect x="78" y="90" width="8" height="8" rx="2" fill="#D8D8E0" opacity="0.4"/>
    <rect x="90" y="90" width="8" height="8" rx="2" fill="#D8D8E0" opacity="0.5"/>

    <rect x="78" y="108" width="8" height="8" rx="2" fill="#D8D8E0" opacity="0.4"/>
    <rect x="90" y="120" width="8" height="8" rx="2" fill="#D8D8E0" opacity="0.3"/>
    <rect x="78" y="132" width="8" height="8" rx="2" fill="#D8D8E0" opacity="0.4"/>
    <rect x="90" y="108" width="8" height="8" rx="2" fill="#D8D8E0" opacity="0.5"/>

    <rect x="112" y="80" width="8" height="8" rx="2" fill="#D8D8E0" opacity="0.4"/>
    <rect x="124" y="80" width="8" height="8" rx="2" fill="#D8D8E0" opacity="0.3"/>
    <rect x="136" y="90" width="8" height="8" rx="2" fill="#D8D8E0" opacity="0.5"/>
    <rect x="112" y="92" width="8" height="8" rx="2" fill="#D8D8E0" opacity="0.4"/>

    <!-- Red scan line (failed scan highlight) -->
    <rect x="22" y="88" width="134" height="3" rx="1.5" fill="url(#scanline-grad)" opacity="0.85"/>
    <defs>
      <linearGradient id="scanline-grad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#FF5A76" stop-opacity="0"/>
        <stop offset="20%" stop-color="#FF5A76" stop-opacity="1"/>
        <stop offset="80%" stop-color="#FF5A76" stop-opacity="1"/>
        <stop offset="100%" stop-color="#FF5A76" stop-opacity="0"/>
      </linearGradient>
    </defs>
  </g>

  <!-- Plant on right -->
  <g transform="translate(302, 120)">
    <!-- Pot -->
    <rect x="8" y="60" width="40" height="28" rx="6" fill="#E8E0D8"/>
    <rect x="4" y="56" width="48" height="10" rx="5" fill="#D8CEBE"/>
    <!-- Stems & leaves -->
    <path d="M28 58 Q28 30 44 12" stroke="#7CB87A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M28 45 Q14 32 8 16" stroke="#7CB87A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <ellipse cx="47" cy="10" rx="12" ry="20" fill="#84C882" transform="rotate(-20 47 10)"/>
    <ellipse cx="7" cy="15" rx="11" ry="19" fill="#6DB86B" transform="rotate(25 7 15)"/>
    <ellipse cx="34" cy="8" rx="9" ry="16" fill="#78BF76" transform="rotate(-10 34 8)"/>
  </g>

  <!-- Robot character -->
  <g transform="translate(50, 100)">
    <!-- Body shadow -->
    <ellipse cx="55" cy="135" rx="38" ry="8" fill="rgba(0,0,0,0.08)"/>

    <!-- Body -->
    <rect x="22" y="68" width="66" height="58" rx="20" fill="#F0F0F0"/>
    <!-- Body highlight -->
    <rect x="22" y="68" width="66" height="24" rx="20" fill="#FAFAFA" opacity="0.7"/>

    <!-- Small arms -->
    <rect x="6" y="82" width="18" height="30" rx="9" fill="#E8E8E8"/>
    <rect x="86" y="82" width="18" height="30" rx="9" fill="#E8E8E8"/>

    <!-- Legs -->
    <rect x="32" y="118" width="20" height="18" rx="8" fill="#E0E0E0"/>
    <rect x="58" y="118" width="20" height="18" rx="8" fill="#E0E0E0"/>
    <!-- Feet -->
    <ellipse cx="42" cy="136" rx="12" ry="7" fill="#D8D8D8"/>
    <ellipse cx="68" cy="136" rx="12" ry="7" fill="#D8D8D8"/>

    <!-- Head -->
    <rect x="15" y="20" width="80" height="62" rx="22" fill="#EFEFEF"/>
    <!-- Head top highlight -->
    <rect x="15" y="20" width="80" height="22" rx="22" fill="#FAFAFA" opacity="0.7"/>

    <!-- Antenna -->
    <line x1="55" y1="20" x2="55" y2="6" stroke="#D8D8D8" stroke-width="3" stroke-linecap="round"/>
    <circle cx="55" cy="4" r="5" fill="#FF7090"/>
    <circle cx="55" cy="4" r="2.5" fill="#FF9AB0"/>

    <!-- Face screen (dark visor) -->
    <rect x="25" y="32" width="60" height="38" rx="12" fill="#2A2A35"/>
    <!-- Screen gloss -->
    <rect x="25" y="32" width="60" height="16" rx="12" fill="white" opacity="0.06"/>

    <!-- Eyes (worried) -->
    <ellipse cx="41" cy="50" rx="8" ry="9" fill="white"/>
    <ellipse cx="69" cy="50" rx="8" ry="9" fill="white"/>
    <!-- Pupils looking worried (shifted up-left) -->
    <ellipse cx="39" cy="47" rx="4" ry="5" fill="#1A1A25"/>
    <ellipse cx="67" cy="47" rx="4" ry="5" fill="#1A1A25"/>
    <!-- Worried eyebrow lines -->
    <path d="M32 36 Q41 33 47 36" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M63 36 Q69 33 78 36" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
    <!-- Mouth (sad curved) -->
    <path d="M44 62 Q55 57 66 62" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5"/>

    <!-- Magnifying glass (held by right arm) -->
    <g transform="translate(76, 76) rotate(-30)">
      <!-- Glass circle -->
      <circle cx="16" cy="16" r="15" fill="none" stroke="#FF5A76" stroke-width="4"/>
      <circle cx="16" cy="16" r="14" fill="white" opacity="0.25"/>
      <!-- Glass shine -->
      <path d="M9 9 Q12 7 14 9" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
      <!-- Handle -->
      <line x1="26" y1="26" x2="38" y2="38" stroke="#D94060" stroke-width="5" stroke-linecap="round"/>
    </g>
  </g>
</svg>
